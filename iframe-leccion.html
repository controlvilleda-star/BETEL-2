<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lección Diaria</title>
  <link rel="stylesheet" href="./styles.css" />
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  
  <style>
    body {
      background: transparent;
      padding: 16px;
      margin: 0;
      min-height: auto;
      top: 0px !important;
      font-family: Inter, Segoe UI, sans-serif;
    }
    
    /* Ocultar elementos de Google Translate */
    .skiptranslate { display: none !important; }
    .VIpgJd-ZVi9od-aZ2wEe-wOHMyf { display: none !important; }
    #goog-gt-tt { display: none !important; }
    
    .widget-container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      padding: 32px;
      border: 1px solid var(--line);
      position: relative;
    }
    
    .lang-switcher {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
      justify-content: flex-end;
    }
    .lang-btn {
      background: var(--surface-warm);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
      color: var(--ink);
      transition: all 0.2s;
    }
    .lang-btn:hover { background: var(--line); }
    .lang-btn.active {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }

    .date-header {
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
      margin-bottom: 16px;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .lesson-title {
      color: #9c4122;
      font-size: 1.8rem;
      font-weight: 800;
      margin: 0 0 24px 0;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    .inter-image {
      margin: 28px 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    
    .inter-image img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      max-height: 350px;
    }

    /* Estilos dinámicos para el contenido de Adventech */
    .sabbath-content {
      font-size: 1.1rem;
      line-height: 1.65;
      color: var(--ink);
    }
    
    .sabbath-content p {
      margin-bottom: 20px;
    }
    
    .sabbath-content h3 {
      font-size: 1.25rem;
      color: #9c4122;
      margin-top: 32px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .sabbath-content blockquote {
      margin: 32px 0;
      padding: 20px;
      background: var(--surface);
      border-radius: var(--radius);
      border-left: 4px solid #0f766e;
    }
    
    .sabbath-content blockquote p {
      font-size: 1.05rem;
      color: #0f766e;
      margin-bottom: 12px;
      font-family: Inter, sans-serif;
    }
    
    .sabbath-content blockquote p:last-child {
      margin-bottom: 0;
    }
    
    .sabbath-content .verse {
      color: #b33914;
      font-weight: 600;
      text-decoration: underline;
      text-decoration-color: rgba(179, 57, 20, 0.4);
      text-underline-offset: 3px;
    }

    /* Loading state */
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 0;
      color: var(--muted);
    }
    .spinner {
      border: 3px solid rgba(0,0,0,0.1);
      border-left-color: var(--gold);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Contenedor oculto de Google Translate -->
  <div id="google_translate_element" style="display:none;"></div>

  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'es',
        includedLanguages: 'en,it,es,ca',
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <div class="widget-container" id="widget-root">
    <div class="loader">
      <div class="spinner"></div>
      <p>Cargando la lección de hoy...</p>
    </div>
  </div>

  <script>
    function changeLanguage(langCode, btn) {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');

      const select = document.querySelector('.goog-te-combo');
      if (select) {
        select.value = langCode;
        select.dispatchEvent(new Event('change'));
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/[&<>'"]/g, 
        tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
          }[tag] || tag)
      );
    }

    async function loadAdventechData() {
      try {
        const parseDate = (dStr) => {
          const parts = dStr.split('/');
          return new Date(parts[2], parts[1] - 1, parts[0]);
        };
        
        // 1. Obtener listado de trimestres
        const qRes = await fetch("https://sabbath-school.adventech.io/api/v2/es/quarterlies/index.json");
        const quarters = await qRes.json();
        const currentQ = quarters[0]; // El actual siempre es el primero
        
        // 2. Obtener detalles del trimestre (lecciones)
        const lRes = await fetch(currentQ.full_path + "/index.json");
        const qDetail = await lRes.json();
        
        const today = new Date();
        today.setHours(0,0,0,0);
        
        // 3. Buscar la lección de esta semana
        let currentLesson = qDetail.lessons[qDetail.lessons.length - 1];
        for (const lesson of qDetail.lessons) {
          if (today >= parseDate(lesson.start_date) && today <= parseDate(lesson.end_date)) {
            currentLesson = lesson;
            break;
          }
        }
        
        // 4. Obtener los días de esa lección
        const dRes = await fetch(currentLesson.full_path + "/index.json");
        const lDetail = await dRes.json();
        
        const d = String(today.getDate()).padStart(2, '0');
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const y = today.getFullYear();
        const todayStr = `${d}/${m}/${y}`;
        
        // 5. Encontrar el día exacto de hoy
        let currentDay = lDetail.days.find(day => day.date === todayStr);
        if (!currentDay) currentDay = lDetail.days[0];
        
        // 6. Obtener el contenido del día
        const readRes = await fetch(currentDay.full_read_path + "/index.json");
        const readDetail = await readRes.json();

        renderWidget(currentQ, currentLesson, currentDay, readDetail);
      } catch (err) {
        document.getElementById("widget-root").innerHTML = `
          <div style="padding: 20px; text-align: center; color: #9c4122;">
            <h3>No pudimos cargar la lección de hoy</h3>
            <p>Verifica tu conexión a internet e intenta de nuevo.</p>
          </div>
        `;
        console.error(err);
      }
    }

    function renderWidget(quarter, lesson, day, read) {
      const root = document.getElementById("widget-root");
      
      const dateParts = day.date.split('/');
      const dateObj = new Date(dateParts[2], dateParts[1] - 1, dateParts[0]);
      const formattedDate = dateObj.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });

      // Inyectar la imagen después del primer párrafo
      let contentHtml = read.content;
      const imgHtml = `
        <div class="inter-image">
          <img src="${lesson.cover}" alt="Imagen de la Lección de esta Semana">
        </div>
      `;
      contentHtml = contentHtml.replace('</p>', '</p>' + imgHtml);

      root.innerHTML = `
        <div class="lang-switcher" translate="no">
          <button class="lang-btn active" onclick="changeLanguage('es', this)">🇪🇸 ES</button>
          <button class="lang-btn" onclick="changeLanguage('en', this)">🇬🇧 EN</button>
          <button class="lang-btn" onclick="changeLanguage('it', this)">🇮🇹 IT</button>
          <button class="lang-btn" onclick="changeLanguage('ca', this)">🏴 CA</button>
        </div>

        <div class="date-header">${escapeHtml(formattedDate)}</div>
        <h1 class="lesson-title">${escapeHtml(day.title)}</h1>
        
        <div class="sabbath-content">
          ${contentHtml}
        </div>
      `;
    }

    document.addEventListener("DOMContentLoaded", loadAdventechData);
  </script>
</body>
</html>
