
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lección Diaria</title>
  <link rel="stylesheet" href="./styles.css" />
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  
  <style>
    body {
      background: transparent;
      padding: 16px;
      margin: 0;
      min-height: auto;
      top: 0px !important;
      font-family: Inter, Segoe UI, sans-serif;
    }
    
    /* Ocultar elementos de Google Translate */
    .skiptranslate { display: none !important; }
    .VIpgJd-ZVi9od-aZ2wEe-wOHMyf { display: none !important; }
    #goog-gt-tt { display: none !important; }
    
    .widget-container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      padding: 32px;
      border: 1px solid var(--line);
      position: relative;
    }
    
    .lang-switcher {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
      justify-content: flex-end;
    }
    .lang-btn {
      background: var(--surface-warm);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
      color: var(--ink);
      transition: all 0.2s;
    }
    .lang-btn:hover { background: var(--line); }
    .lang-btn.active {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }

    .date-header {
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
      margin-bottom: 16px;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .lesson-title {
      color: #9c4122;
      font-size: 1.8rem;
      font-weight: 800;
      margin: 0 0 24px 0;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    .inter-image {
      margin: 28px 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    
    .inter-image img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      max-height: 350px;
    }

    .sabbath-content {
      font-size: 1.1rem;
      line-height: 1.65;
      color: var(--ink);
    }
    
    .sabbath-content p {
      margin-bottom: 20px;
    }
    
    .sabbath-content h3 {
      font-size: 1.25rem;
      color: #9c4122;
      margin-top: 32px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .sabbath-content blockquote {
      margin: 32px 0;
      padding: 20px;
      background: var(--surface);
      border-radius: var(--radius);
      border-left: 4px solid #0f766e;
    }
    
    .sabbath-content blockquote p {
      font-size: 1.05rem;
      color: #0f766e;
      margin-bottom: 12px;
      font-family: Inter, sans-serif;
    }
    
    .sabbath-content blockquote p:last-child {
      margin-bottom: 0;
    }
    
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 0;
      color: var(--muted);
    }
    .spinner {
      border: 3px solid rgba(0,0,0,0.1);
      border-left-color: var(--gold);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Modal Styles */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
      z-index: 99999; padding: 20px; box-sizing: border-box; backdrop-filter: blur(4px);
    }
    .modal-content {
      background: white; padding: 28px; border-radius: 16px; width: 100%; max-width: 380px;
      position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.2); text-align: center;
    }
    .modal-close {
      position: absolute; top: 12px; right: 16px; background: none; border: none; font-size: 28px; cursor: pointer; color: var(--muted);
    }
    .modal-btn {
      display: block; width: 100%; padding: 14px; margin-bottom: 12px;
      background: var(--surface-warm); border: 1px solid var(--line); border-radius: 8px;
      font-weight: 600; font-size: 1rem; color: var(--ink); cursor: pointer;
      text-align: center; text-decoration: none; box-sizing: border-box; transition: 0.2s;
    }
    .modal-btn:hover { background: var(--line); }
    .modal-btn.primary {
      background: #0f766e; color: white; border-color: #0f766e;
    }
    .modal-btn.primary:hover { background: #0d615b; }
    .preview-img {
      width: 100%; border-radius: 8px; margin-top: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid var(--line);
    }
    .modal-title { margin-top: 0; margin-bottom: 20px; font-size: 1.25rem; color: #9c4122; }
  </style>
</head>
<body>
  <!-- Contenedor oculto de Google Translate -->
  <div id="google_translate_element" style="display:none;"></div>

  <!-- Modal para Acciones de Cita -->
  <div id="action-modal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">×</button>
      <h3 class="modal-title">¿Qué deseas hacer?</h3>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'es',
        includedLanguages: 'en,it,es,ca',
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <div class="widget-container" id="widget-root">
    <div class="loader">
      <div class="spinner"></div>
      <p>Cargando la lección de hoy...</p>
    </div>
  </div>

  <script>
    function changeLanguage(langCode, btn) {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');

      const select = document.querySelector('.goog-te-combo');
      if (select) {
        select.value = langCode;
        select.dispatchEvent(new Event('change'));
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/[&<>'"]/g, 
        tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
          }[tag] || tag)
      );
    }

    async function loadAdventechData() {
      try {
        const parseDate = (dStr) => {
          const parts = dStr.split('/');
          return new Date(parts[2], parts[1] - 1, parts[0]);
        };
        
        const qRes = await fetch("https://sabbath-school.adventech.io/api/v2/es/quarterlies/index.json");
        const quarters = await qRes.json();
        const currentQ = quarters[0];
        
        const lRes = await fetch(currentQ.full_path + "/index.json");
        const qDetail = await lRes.json();
        
        const today = new Date();
        today.setHours(0,0,0,0);
        
        let currentLesson = qDetail.lessons[qDetail.lessons.length - 1];
        for (const lesson of qDetail.lessons) {
          if (today >= parseDate(lesson.start_date) && today <= parseDate(lesson.end_date)) {
            currentLesson = lesson;
            break;
          }
        }
        
        const dRes = await fetch(currentLesson.full_path + "/index.json");
        const lDetail = await dRes.json();
        
        const d = String(today.getDate()).padStart(2, '0');
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const y = today.getFullYear();
        const todayStr = `${d}/${m}/${y}`;
        
        let currentDay = lDetail.days.find(day => day.date === todayStr);
        if (!currentDay) currentDay = lDetail.days[0];
        
        const readRes = await fetch(currentDay.full_read_path + "/index.json");
        const readDetail = await readRes.json();

        renderWidget(currentQ, currentLesson, currentDay, readDetail);
      } catch (err) {
        document.getElementById("widget-root").innerHTML = `
          <div style="padding: 20px; text-align: center; color: #9c4122;">
            <h3>No pudimos cargar la lección de hoy</h3>
            <p>Verifica tu conexión a internet e intenta de nuevo.</p>
          </div>
        `;
        console.error(err);
      }
    }

    function renderWidget(quarter, lesson, day, read) {
      const root = document.getElementById("widget-root");
      
      const dateParts = day.date.split('/');
      const dateObj = new Date(dateParts[2], dateParts[1] - 1, dateParts[0]);
      const formattedDate = dateObj.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });

      let contentHtml = read.content;
      const imgHtml = `
        <div class="inter-image">
          <img src="${lesson.cover}" alt="Imagen de la Lección de esta Semana">
        </div>
      `;
      contentHtml = contentHtml.replace('</p>', '</p>' + imgHtml);

      root.innerHTML = `
        <div class="lang-switcher" translate="no">
          <button class="lang-btn active" onclick="changeLanguage('es', this)">🇪🇸 ES</button>
          <button class="lang-btn" onclick="changeLanguage('en', this)">🇬🇧 EN</button>
          <button class="lang-btn" onclick="changeLanguage('it', this)">🇮🇹 IT</button>
          <button class="lang-btn" onclick="changeLanguage('ca', this)">🏴 CA</button>
        </div>

        <div class="date-header">${escapeHtml(formattedDate)}</div>
        <h1 class="lesson-title">${escapeHtml(day.title)}</h1>
        
        <div class="sabbath-content" id="sabbath-content-box">
          ${contentHtml}
        </div>
        
        <style>
          .highlight-pastel {
            background-image: linear-gradient(120deg, var(--highlight-color, rgba(253, 224, 71, 0.5)) 0%, var(--highlight-color, rgba(253, 224, 71, 0.5)) 100%);
            background-repeat: no-repeat;
            background-size: 100% 45%;
            background-position: 0 90%;
            cursor: pointer;
            transition: background-size 0.2s ease-in-out;
            border-radius: 2px;
            padding: 0 2px;
          }
          .highlight-pastel:hover {
            background-size: 100% 100%;
          }
          .verse {
            cursor: pointer;
            text-decoration: none;
            border-bottom: 2px solid #b33914;
            color: #b33914;
            font-weight: 600;
          }
        </style>
      `;

      const contentBox = document.getElementById('sabbath-content-box');
      
      const categoryColors = [
        { color: "rgba(253, 224, 71, 0.6)", keys: ["gracia", "salvación", "santuario", "justicia"] },
        { color: "rgba(167, 243, 208, 0.7)", keys: ["jesús", "cristo", "dios", "espíritu", "señor"] },
        { color: "rgba(191, 219, 254, 0.7)", keys: ["sábado", "pacto", "ley", "mandamiento", "profecía"] },
        { color: "rgba(254, 205, 211, 0.7)", keys: ["fe", "esperanza", "amor", "paz", "perdón"] }
      ];
      
      const walker = document.createTreeWalker(contentBox, NodeFilter.SHOW_TEXT, null, false);
      const nodes = [];
      let node;
      while (node = walker.nextNode()) nodes.push(node);
      
      nodes.forEach(n => {
        if (n.parentNode.tagName === 'A' || n.parentNode.tagName === 'SPAN' || n.parentNode.tagName === 'H3') return;
        const text = n.nodeValue;
        const sentenceRegex = /([A-Z¿¡][^.?!]+[.?!])/g;
        let modified = false;
        
        let newHtml = text.replace(sentenceRegex, (sentence) => {
          const lower = sentence.toLowerCase();
          let matchedColor = null;
          for (const cat of categoryColors) {
            if (cat.keys.some(kw => lower.includes(kw))) {
              matchedColor = cat.color; break;
            }
          }
          if (matchedColor) {
            modified = true;
            return `<span class="highlight-pastel" style="--highlight-color: ${matchedColor}" title="Haz clic para interactuar">${sentence}</span>`;
          }
          return sentence;
        });
        
        if (modified) {
          const span = document.createElement('span');
          span.innerHTML = newHtml;
          n.parentNode.replaceChild(span, n);
        }
      });
      
      document.querySelectorAll('.verse').forEach(v => {
        v.innerHTML += ' (RV1909)';
        v.classList.add('highlight-pastel');
        v.style.setProperty('--highlight-color', 'rgba(253, 224, 71, 0.6)');
        v.title = "Haz clic para interactuar";
      });

      contentBox.addEventListener('click', (e) => {
        if (e.target.classList.contains('highlight-pastel') || e.target.classList.contains('verse')) {
          const isVerse = e.target.classList.contains('verse');
          const rawText = e.target.innerText;
          const textToShare = rawText.replace(' (RV1909)', '');
          showModal(textToShare, isVerse, rawText);
        }
      });
    }

    // Funciones del Modal
    function showModal(textToShare, isVerse, rawText) {
      const modal = document.getElementById('action-modal');
      const body = document.getElementById('modal-body');
      
      let html = '';
      if (isVerse) {
        // Formatear texto para búsqueda: "Mateo 26: 36 al 42" -> "Mateo 26:36-42"
        let query = rawText.replace(' (RV1909)', '').replace(/ al /gi, '-').replace(/ y /gi, ',');
        html += `<a href="https://www.biblegateway.com/passage/?search=${encodeURIComponent(query)}&version=RVA" target="_blank" class="modal-btn" onclick="closeModal()">📖 Leer Versículo (RV1909)</a>`;
      }
      
      const safeText = textToShare.replace(/'/g, "\\'").replace(/"/g, '&quot;');
      html += `<button class="modal-btn primary" onclick="handleShare('${safeText}')">📲 Generar Imagen para Estado</button>`;
      
      body.innerHTML = html;
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('action-modal').style.display = 'none';
    }

    async function handleShare(text) {
      const body = document.getElementById('modal-body');
      body.innerHTML = '<div class="loader" style="padding: 10px 0;"><div class="spinner"></div><p style="margin:0;">Generando...</p></div>';
      
      try {
        const blob = await generateImageBlob(text);
        const file = new File([blob], 'cita_escuela_sabatica.png', { type: 'image/png' });
        
        // Intentar usar la API Nativa de Compartir
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              title: 'Cita de Escuela Sabática',
              files: [file]
            });
            closeModal();
          } catch (err) {
            console.log('Usuario canceló o falló share nativo:', err);
            showImageFallback(blob);
          }
        } else {
          showImageFallback(blob);
        }
      } catch (err) {
        body.innerHTML = '<p style="color:red">Error al generar la imagen.</p>';
      }
    }

    function showImageFallback(blob) {
      const body = document.getElementById('modal-body');
      const url = URL.createObjectURL(blob);
      body.innerHTML = `
        <p style="font-size: 0.95rem; color: #17211c; margin-bottom: 8px;">
          <b>Mantén presionada</b> la imagen para guardarla o compartirla en WhatsApp.
        </p>
        <img src="${url}" class="preview-img" alt="Cita Generada" />
        <a href="${url}" download="cita_adventista.png" class="modal-btn" style="margin-top: 16px;">Descargar</a>
      `;
    }

    async function generateImageBlob(text) {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = 1080;
        canvas.height = 1920;
        const ctx = canvas.getContext('2d');
        
        const pastelGradients = [
          ['#ffecd2', '#fcb69f'], ['#cfd9df', '#e2ebf0'], ['#a1c4fd', '#c2e9fb'], 
          ['#fbc2eb', '#a6c1ee'], ['#fdcbf1', '#e6dee9'], ['#a8edea', '#fed6e3'], 
          ['#e0c3fc', '#8ec5fc'], ['#fdfbfb', '#ebedee'], ['#f5f7fa', '#c3cfe2']
        ];
        
        const gradientColors = pastelGradients[Math.floor(Math.random() * pastelGradients.length)];
        const gradient = ctx.createLinearGradient(0, 0, 1080, 1920);
        gradient.addColorStop(0, gradientColors[0]);
        gradient.addColorStop(1, gradientColors[1]);
        
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 1080, 1920);
        
        ctx.fillStyle = 'rgba(178, 138, 80, 0.4)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 160px Georgia';
        ctx.fillText('“', 540, 1920 / 2 - 250);
        
        ctx.fillStyle = '#17211c';
        ctx.font = 'bold 64px Inter, sans-serif';
        
        const words = text.split(' ');
        let line = '';
        let posY = 1920 / 2 - 150;
        const lineHeight = 95;
        const maxWidth = 880;
        
        for(let n = 0; n < words.length; n++) {
          let testLine = line + words[n] + ' ';
          let metrics = ctx.measureText(testLine);
          if (metrics.width > maxWidth && n > 0) {
            ctx.fillText(line, 540, posY);
            line = words[n] + ' ';
            posY += lineHeight;
          } else {
            line = testLine;
          }
        }
        ctx.fillText(line, 540, posY);
        
        ctx.fillStyle = 'rgba(23, 33, 28, 0.6)';
        ctx.font = '500 36px Inter, sans-serif';
        ctx.fillText('Escuela Sabática', 540, 1920 - 150);
        
        canvas.toBlob(blob => resolve(blob), 'image/png');
      });
    }

    document.addEventListener("DOMContentLoaded", loadAdventechData);
  </script>
</body>
</html>
