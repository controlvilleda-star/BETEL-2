<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lección Diaria</title>
  <link rel="stylesheet" href="./styles.css" />
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="./app.js"></script>
  
  <style>
    body {
      background: transparent;
      padding: 12px;
      margin: 0;
      min-height: auto;
      top: 0px !important;
    }
    
    /* Ocultar elementos de Google Translate */
    .skiptranslate { display: none !important; }
    .VIpgJd-ZVi9od-aZ2wEe-wOHMyf { display: none !important; }
    #goog-gt-tt { display: none !important; }
    
    .widget-container {
      max-width: 600px;
      margin: 0 auto;
    }
    
    .lang-switcher {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      justify-content: flex-end;
    }
    .lang-btn {
      background: var(--surface-warm);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
      color: var(--ink);
      transition: all 0.2s;
    }
    .lang-btn:hover {
      background: var(--line);
    }
    .lang-btn.active {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }

    .memory-block {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      text-align: center;
    }
    .memory-block h3 {
      color: var(--gold);
      font-size: 0.85rem;
      margin: 0 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .memory-block p {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.15rem;
      color: #3b2a10;
      margin: 0 0 8px 0;
      font-style: italic;
    }
    .memory-block span {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
    }

    .date-label {
      display: inline-block;
      background: var(--gold);
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .bible-embed {
      margin-top: 16px;
      padding: 16px;
      border-left: 4px solid var(--gold);
      background: var(--surface-warm);
      border-radius: 0 var(--radius) var(--radius) 0;
      font-family: Georgia, "Times New Roman", serif;
      color: #3b2a10;
    }
    .bible-embed h4 {
      margin: 0 0 10px 0;
      font-size: 0.9rem;
      color: var(--gold);
      font-family: Inter, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .bible-embed p {
      margin: 0 0 8px 0;
      line-height: 1.6;
      font-size: 1.08rem;
    }
    .bible-embed p:last-child {
      margin-bottom: 0;
    }
    .bible-meta {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: right;
      display: block;
      margin-top: 10px;
      font-style: italic;
    }
    .egw-mini {
      border-radius: var(--radius);
      border: 1px solid var(--line);
      display: grid;
      gap: 8px;
      padding: 14px;
      background: var(--surface-warm);
      margin-top: 16px;
    }
    .egw-mini strong {
      color: var(--gold);
    }
    .egw-mini p {
      margin: 0;
      color: #593a0c;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.45;
    }
    .egw-mini span {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="widget-container" id="widget-root"></div>

  <!-- Contenedor oculto de Google Translate -->
  <div id="google_translate_element" style="display:none;"></div>

  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'es',
        includedLanguages: 'en,it,es,ca',
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <script>
    const bibleTexts = {
      "Hebreos 11:1": "Es pues la fe la sustancia de las cosas que se esperan, la demostración de las cosas que no se ven.",
      "Romanos 1:17; 2 Corintios 5:7": "<strong>Romanos 1:17</strong><br>Porque en él la justicia de Dios se descubre de fe en fe; como está escrito: Mas el justo vivirá por la fe.<br><br><strong>2 Corintios 5:7</strong><br>(Porque por fe andamos, no por vista;)",
      "Marcos 9:14-29": "<strong>Marcos 9:23-24</strong><br>Y Jesús le dijo: Si puedes creer, al que cree todo es posible. Y luego el padre del muchacho, llorando y clamando, dijo: Creo, ayuda mi incredulidad. <em>(Extracto del relato)</em>",
      "Hebreos 11:1; Early Writings, p. 72": "<strong>Hebreos 11:1</strong><br>Es pues la fe la sustancia de las cosas que se esperan, la demostración de las cosas que no se ven.",
      "Santiago 2:17-18; Hebreos 11": "<strong>Santiago 2:17-18</strong><br>Así también la fe, si no tuviere obras, es muerta en sí misma. Pero alguno dirá: Tú tienes fe, y yo tengo obras: muéstrame tu fe sin tus obras, y yo te mostraré mi fe por mis obras.",
      "Hebreos 11:8; Genesis 12:1-4": "<strong>Génesis 12:1</strong><br>EMPERO Jehová había dicho á Abram: Vete de tu tierra y de tu parentela, y de la casa de tu padre, á la tierra que te mostraré.<br><br><strong>Hebreos 11:8</strong><br>Por la fe Abraham, siendo llamado, obedeció para salir al lugar que había de recibir por heredad; y salió sin saber dónde iba.",
      "Hebreos 11; Ellen G. White, Early Writings, p. 72": "<strong>Hebreos 11:1-2</strong><br>Es pues la fe la sustancia de las cosas que se esperan, la demostración de las cosas que no se ven. Porque por ella alcanzaron testimonio los antiguos. <em>(Inicio del capítulo)</em>",
      "Hebreos 11": "<strong>Hebreos 11:1-2</strong><br>Es pues la fe la sustancia de las cosas que se esperan, la demostración de las cosas que no se ven. Porque por ella alcanzaron testimonio los antiguos."
    };

    function changeLanguage(langCode, btn) {
      // Remover clase active de todos los botones
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const select = document.querySelector('.goog-te-combo');
      if (select) {
        select.value = langCode;
        select.dispatchEvent(new Event('change'));
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const day = getTodaySchoolDay();
      const root = document.getElementById("widget-root");
      
      const bibleText = bibleTexts[day.reading] || "Texto bíblico completo disponible en tu Biblia.";

      // Formatear la fecha
      const dateParts = day.date.split('-');
      const dateObj = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
      const formattedDate = dateObj.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

      root.innerHTML = `
        <div class="lang-switcher" translate="no">
          <button class="lang-btn active" onclick="changeLanguage('es', this)">🇪🇸 ES</button>
          <button class="lang-btn" onclick="changeLanguage('en', this)">🇬🇧 EN</button>
          <button class="lang-btn" onclick="changeLanguage('it', this)">🇮🇹 IT</button>
          <button class="lang-btn" onclick="changeLanguage('ca', this)">🏴 CA</button>
        </div>

        <div class="memory-block">
          <h3>Versículo para Memorizar</h3>
          <p>"${escapeHtml(sabbathSchool.memoryText)}"</p>
          <span>— ${escapeHtml(sabbathSchool.memoryRef)}</span>
        </div>

        <div class="module">
          <div class="module-head">
            <div>
              <span class="date-label">${escapeHtml(formattedDate)}</span>
              <p class="eyebrow">${escapeHtml(sabbathSchool.title)}</p>
              <h2 style="margin-bottom: 4px;">${escapeHtml(day.label)}: ${escapeHtml(day.title)}</h2>
            </div>
          </div>
          <div class="module-body" style="padding-top: 10px;">
            <p style="margin: 0 0 16px; color: var(--ink); line-height: 1.5; font-size: 1.02rem;">${escapeHtml(day.summary)}</p>
            
            <div class="bible-embed">
              <h4><i data-lucide="book-open" style="width: 14px; height: 14px; margin-right: 4px; vertical-align: text-bottom;"></i> Lectura: ${escapeHtml(day.reading)}</h4>
              <p>${bibleText}</p>
              <span class="bible-meta" translate="no">Reina Valera Antigua (RV1909)</span>
            </div>
            
            <div class="egw-mini">
              <div class="row-top">
                <strong>${escapeHtml(sabbathSchool.egwFocus.reference)}</strong>
                ${
                  sabbathSchool.egwFocus.link
                    ? `<a href="${escapeHtml(sabbathSchool.egwFocus.link)}" target="_blank" rel="noopener noreferrer" class="icon-button ghost" style="min-height:24px;width:24px;height:24px;padding:0;" title="Leer párrafo completo">
                         <i data-lucide="external-link" style="width:14px;height:14px"></i>
                       </a>`
                    : ``
                }
              </div>
              <p>"${escapeHtml(sabbathSchool.egwFocus.quote)}"</p>
              <span>${escapeHtml(sabbathSchool.egwFocus.note)}</span>
            </div>
          </div>
        </div>
      `;

      if (window.lucide) {
        window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
